[build]
  command = "npm run build"
  publish = "static"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/webhooks/github"
  to = "/.netlify/functions/github-webhook"
  status = 200
